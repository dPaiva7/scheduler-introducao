[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
logfile_maxbytes=0

[program:messenger-async]
command=php /var/www/html/bin/console messenger:consume async --time-limit=3600 --memory-limit=128M
user=root
numprocs=1
startsecs=0
autostart=true
autorestart=true
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:scheduler-default]
command=php /var/www/html/bin/console messenger:consume scheduler_default --time-limit=3600 --memory-limit=128M
user=root
numprocs=1
startsecs=0
autostart=true
autorestart=true
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
